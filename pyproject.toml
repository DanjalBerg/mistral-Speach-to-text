[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mistral-speech-to-text"
version = "0.1.0"
description = "Realtime speech-to-text live subtitles as a transparent always-on-top overlay, powered by the Mistral API (Voxtral Mini Transcribe Realtime 3) with a cross-platform Qt window and console fallback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "websockets>=13",
  "numpy>=1.24",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4"]
overlay = ["PySide6>=6.5"]
all = ["sounddevice>=0.4", "PySide6>=6.5"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mistral-stt = "mistral_speech_to_text.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
